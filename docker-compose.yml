services:
  frontend-prod:
    build: .
    container_name: online_shop_frontend_prod
    restart: always
    ports:
      - 3001:80
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_LOGO_PATH=${VITE_LOGO_PATH}
      - VITE_SITE_URL=${VITE_SITE_URL}
      - VITE_RYBBIT_SITE_ID=${VITE_RYBBIT_SITE_ID}
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./assets/logo.jpg:/usr/share/nginx/html/assets/logo.jpg
      - ./assets/payment-types:/usr/share/nginx/html/assets/payment-types:ro
      - ./public/legal:/usr/share/nginx/html/legal:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
