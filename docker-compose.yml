services:
  frontend-prod:
    build: .
    container_name: online_shop_frontend_prod
    restart: always
    ports:
      - 3001:80
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_APP_NAME=${VITE_APP_NAME}
      - VITE_LOGO_PATH=${VITE_LOGO_PATH}
      - NODE_ENV=production
    env_file:
      - .env 