services:
  product-importer:
    build: .
    container_name: product-importer
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://host.docker.internal:8001/api/v1}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./produse_procesate.json:/app/produse_procesate.json:ro
    network_mode: host
    depends_on:
      - backend-health-check

  backend-health-check:
    image: curlimages/curl:latest
    container_name: backend-health-check
    command: >
      sh -c "
        echo 'Waiting for backend API to be ready...' &&
        until curl -f ${API_BASE_URL:-http://localhost:8001/api/v1}/categories/; do
          echo 'Backend not ready, waiting...' &&
          sleep 5
        done &&
        echo 'Backend is ready!'
      "
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8001/api/v1}
    network_mode: host 