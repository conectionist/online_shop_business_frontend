events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ensure correct MIME type for Web App Manifest
    types {
        application/manifest+json webmanifest;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Ensure correct caching for app shell and service worker
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # Service worker should not be aggressively cached and must be JS
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            default_type application/javascript;
            try_files $uri =404;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|ttf|otf|woff|woff2|webmanifest)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Serve fonts with proper MIME types
        location ~* \.(ttf|otf|woff|woff2)$ {
            add_header Access-Control-Allow-Origin *;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
} 