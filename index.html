    <script>
      // Capture beforeinstallprompt as early as possible so late-mounting components can use it
      (function() {
        window.__DEFERRED_BIP__ = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          try {
            e.preventDefault();
          } catch (_) {}
          window.__DEFERRED_BIP__ = e;
          window.dispatchEvent(new CustomEvent('bip-available'));
        });
        window.addEventListener('appinstalled', function() {
          window.__DEFERRED_BIP__ = null;
          window.dispatchEvent(new CustomEvent('bip-cleared'));
        });
      })();
      // Set the page title dynamically from runtime config
      // Wait for the config to be loaded
      document.addEventListener('DOMContentLoaded', function() {
        if (window.__RUNTIME_CONFIG__ && window.__RUNTIME_CONFIG__.VITE_APP_NAME) {
          document.title = window.__RUNTIME_CONFIG__.VITE_APP_NAME;
        }
      });
    </script>
