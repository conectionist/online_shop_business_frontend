services:
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: online_shop_frontend_prod
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api/v1
      - NODE_ENV=production
    env_file:
      - .env 