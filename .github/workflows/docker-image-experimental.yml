name: Docker Image CI (experimental)

on:
  push:
    branches: [ "experimental" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=experimental
          type=raw,value={{date 'YYYY-MM-DD-HH-mm'}}
          type=sha,prefix=experimental-

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        install: true

    - name: Create Builder Instance
      run: |
        docker buildx create --use --name mybuilder

    - name: Build and push Docker image (experimental)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Cleanup old experimental images (keep last 10)
      if: github.ref == 'refs/heads/experimental'
      run: |
        set -euo pipefail
        # List container package versions (includes created_at and tags)
        if ! VERSIONS_JSON=$(gh api repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions 2>/dev/null); then
          echo "No container package versions found (yet). Skipping cleanup."
          exit 0
        fi

        # Filter to versions that have at least one experimental tag
        # experimental tags considered: "experimental" (floating), "experimental-<sha>", or date tag (YYYY-MM-DD-HH-mm)
        EXP_JSON=$(echo "$VERSIONS_JSON" | jq '[ .[] | select( (.metadata.container.tags // []) | any(.;
          test("^experimental$|
               ^experimental-([a-f0-9]{7,40})$|
               ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}$")) ) ]')

        COUNT=$(echo "$EXP_JSON" | jq 'length')
        echo "Found $COUNT experimental image versions."

        if [ "$COUNT" -le 10 ]; then
          echo "Nothing to clean up."
          exit 0
        fi

        # Sort by created_at descending, skip first 10 (most recent), delete the rest
        echo "$EXP_JSON" \
          | jq -r 'sort_by(.created_at) | reverse | .[10:] | .[].id' \
          | while read -r VID; do
              echo "Deleting old experimental image version id: $VID"
              gh api -X DELETE repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions/$VID || true
            done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


