name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract app version
      id: version
      run: |
        APP_VERSION=$(node -p "require('./package.json').version")
        echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "App version: $APP_VERSION"
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          # Add PR ref tags like pr-123
          type=ref,event=pr
          # Only add branch-prefixed sha on default branch to avoid empty prefix on PR builds
          type=sha,format=short,prefix={{branch}}-,enable={{is_default_branch}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value={{date 'YYYY-MM-DD-HH-mm'}},enable={{is_default_branch}}
          type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        install: true

    - name: Create Builder Instance
      run: |
        docker buildx create --use --name mybuilder

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Cleanup old images
      if: github.ref == 'refs/heads/master'
      run: |
        # Get all image tags for this repository
        TAGS=$(gh api repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
        
        if [ -n "$TAGS" ]; then
          # Filter out 'latest', current version, and current commit, then sort by date and keep only 5 most recent
          KEEP_TAGS=$(echo "$TAGS" | grep -v "latest" | grep -v "${{ steps.version.outputs.version }}" | grep -v "${{ github.sha }}" | sort -r | head -5)
          
          # Delete older tags (this will delete the associated image versions)
          echo "$TAGS" | grep -v "latest" | grep -v "${{ steps.version.outputs.version }}" | grep -v "${{ github.sha }}" | sort -r | tail -n +6 | while read tag; do
            if [ -n "$tag" ]; then
              echo "Deleting old image version: $tag"
              gh api -X DELETE repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions/$(gh api repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions --jq ".[] | select(.metadata.container.tags[] | contains(\"$tag\")) | .id")
            fi
          done
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
